[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teger-contracts"
version = "0.1.0"
description = "Typed contracts shared by Teger AI services, agents and clients."
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["teger_contracts*"]
