[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teger-investigator"
version = "0.1.0"
description = "Bounded, evidence-first phishing investigation orchestrator for Teger AI."
requires-python = ">=3.10"
dependencies = ["teger-contracts", "teger-security-core", "teger-ai-analyst", "pydantic>=2.7,<3"]

[project.optional-dependencies]
worker = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["teger_investigator*"]

[tool.setuptools.package-data]
teger_investigator = ["fixtures/*.json"]
