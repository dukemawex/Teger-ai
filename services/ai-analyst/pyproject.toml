[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "teger-ai-analyst"
version = "0.1.0"
description = "Consent-gated, evidence-grounded Claude explanations for Teger AI verdicts."
requires-python = ">=3.10"
dependencies = ["teger-contracts", "teger-security-core", "anthropic>=1.12,<2", "pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
include = ["teger_ai_analyst*"]
